name: Backend CI

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag to promote (sha-<40 hex>)
        required: true
        type: string
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://fitty:change-me@127.0.0.1:3306/fitty
      IMAGE_STORAGE_ROOT: ./var/images

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test

      - name: Build deployment image
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" --tag fitty-backend:ci .

      # Prisma CLI currently pulls a dev-only transitive advisory with no
      # compatible upstream fix. Keep production auditing enabled, while
      # failing the release gate only for critical production vulnerabilities.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  migrate:
    if: github.event_name != 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fitty
          MYSQL_USER: fitty
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: mysql://fitty:ci-password@127.0.0.1:3306/fitty

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to empty MySQL
        run: npx prisma migrate deploy

      - name: Verify migration state
        run: npx prisma migrate status

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify outfit lifecycle against MySQL
        run: RUN_DB_INTEGRATION=1 node --test test/outfit-db.integration.test.js

  publish-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - verify
      - migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://fitty.gubiko.dev
    env:
      IMAGE_REPOSITORY: ghcr.io/fitty2026/fity-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build immutable image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}" \
            .

      - name: Push immutable image
        run: docker push "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"

      - name: Promote image to staging
        run: |
          docker tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}" "${IMAGE_REPOSITORY}:staging"
          docker push "${IMAGE_REPOSITORY}:staging"

      - name: Record published digest
        run: docker inspect "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}" --format '{{index .RepoDigests 0}}'

  promote-existing-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://fitty.gubiko.dev
    env:
      IMAGE_REPOSITORY: ghcr.io/fitty2026/fity-backend
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Validate immutable tag
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "image_tag must match sha-<40 lowercase hex>" >&2
            exit 1
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Promote existing image
        run: |
          docker pull "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" "${IMAGE_REPOSITORY}:staging"
          docker push "${IMAGE_REPOSITORY}:staging"
