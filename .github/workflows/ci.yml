name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://fitty:change-me@127.0.0.1:3306/fitty
      IMAGE_STORAGE_ROOT: ./var/images

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test

      # Prisma CLI currently pulls a dev-only transitive advisory with no
      # compatible upstream fix. Keep production auditing enabled, while
      # failing the release gate only for critical production vulnerabilities.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
