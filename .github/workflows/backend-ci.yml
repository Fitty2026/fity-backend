name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: mysql://root:password@localhost:3306/fitty_db

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: mysql://root:password@localhost:3306/fitty_db

      - name: Run tests
        run: npm test
