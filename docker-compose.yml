name: fitty-staging

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-7d}
  INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:?INTERNAL_WORKER_TOKEN is required}
  IMAGE_STORAGE_ROOT: /app/var/images
  NAVER_RECEIPT_OCR_URL: ${NAVER_RECEIPT_OCR_URL:-}
  NAVER_OCR_SECRET_KEY: ${NAVER_OCR_SECRET_KEY:-}
  AI_OUTFIT_ADAPTER_URL: ${AI_OUTFIT_ADAPTER_URL:-}
  AI_OUTFIT_ADAPTER_TIMEOUT_MS: ${AI_OUTFIT_ADAPTER_TIMEOUT_MS:-10000}
  FALLBACK_OUTFIT_IMAGE_URL: ${FALLBACK_OUTFIT_IMAGE_URL:-/fallback/default-outfit.png}
  INITIAL_PUZZLE_BALANCE: ${INITIAL_PUZZLE_BALANCE:-100}
  OUTFIT_GENERATION_PUZZLE_COST: ${OUTFIT_GENERATION_PUZZLE_COST:-10}
  DEMO_CLOSET_SOURCE_USER_ID: ${DEMO_CLOSET_SOURCE_USER_ID:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  APP_VERSION: ${APP_VERSION:-unknown}
  FRONTEND_COMMIT_SHA: ${FRONTEND_COMMIT_SHA:-unknown}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
  PORT: 3000

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - database
    logging:
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    profiles:
      - tools
    environment: *app-environment
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    container_name: fitty-api
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - image_data:/app/var/images
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  db_data:
  image_data:

networks:
  database:
    internal: true
